services:
  mysql:
    image: mysql 
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tws_db
    volumes:
      - mysql_data:/var/lib/mysql  
    networks:
      - two_tier
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-proot"]
      interval: 10s
      retries: 5
      start_period: 60s
      timeout: 5s

  flaskapp:
    image: ${DOCKER_USER}/flask-app:${DOCKER_TAG}
    container_name: flaskapp
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: tws_db
    networks:
      - two_tier
    ports:
      - "5001:5000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

volumes:
  mysql_data:
    name: mysql_data
networks:
  two_tier:
    name: two_tier

